[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-studio"
version = "0.2.0"
description = "AI-powered educational and motivational video generation studio using Gemini, Manim, and Lumina."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "google-genai",
    "manim",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*"]
